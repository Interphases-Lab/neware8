[build-system]
requires = ["uv_build==0.11.28"]
build-backend = "uv_build"

[project]
name = "py-neware8"
version = "0.2.0"
description = "Native Neware BTS82 communication and measurement recording"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pyarrow>=21,<24"]

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.15", "ruff>=0.11"]

[tool.uv.build-backend]
module-name = "neware8"
source-include = ["docs/**", "tests/**", "uv.lock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/neware8"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
