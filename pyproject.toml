[build-system]
requires = ["uv_build==0.11.28"]
build-backend = "uv_build"

[project]
name = "py-neware8"
version = "0.3.0"
description = "Native Neware BTS82 communication and measurement recording"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pyarrow>=21,<24"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.11",
    "ty==0.0.98",
]

[tool.uv.build-backend]
module-name = "neware8"
source-include = ["docs/**", "tests/**", "uv.lock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.terminal]
error-on-warning = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "ANN"]
ignore = ["ANN401"]  # Any is explicit where payloads are untyped JSON

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]  # fixtures and tests need no annotations
